<div class="grid grid-cols-5 gap-1 w-full max-w-md mx-auto aspect-square">
    {% for square in session.board %}
    {% set is_winning = square.id in session.winning_square_ids %}
    <button
        {% if not square.is_free_space %}
        hx-post="/toggle/{{ square.id }}"
        hx-target="#game-container"
        hx-swap="outerHTML"
        {% endif %}
        {% if square.is_free_space %}disabled{% endif %}
        class="relative flex items-center justify-center p-1 text-center border rounded transition-colors select-none min-h-[64px] text-xs leading-tight
        {%- if square.is_marked %}
            {%- if is_winning %} bg-winning text-cream font-bold
            {%- else %} bg-marked
            {%- endif %}
        {%- else %} bg-white
        {%- endif %}
        {%- if square.is_free_space %} bg-sand font-bold{% endif %}"
        style="border-color: var(--color-border);
        {%- if square.is_marked and is_winning %} background-color: var(--color-rust); color: var(--color-cream);
        {%- elif square.is_marked %} background-color: var(--color-sand-light);
        {%- elif square.is_free_space %} background-color: var(--color-sand);
        {%- endif %}
        color: {% if square.is_marked and is_winning %}var(--color-cream){% else %}var(--color-taupe){% endif %};"
        aria-pressed="{{ 'true' if square.is_marked else 'false' }}"
        aria-label="{{ 'Free space' if square.is_free_space else square.text }}">
        <span class="wrap-break-word hyphens-auto">{{ square.text }}</span>
    </button>
    {% endfor %}
</div>
