<div id="game-container">
<div class="flex flex-col items-center justify-center min-h-full p-6" style="background-color: var(--color-bg);">
    <div class="text-center max-w-sm">
        <h1 class="text-4xl font-bold mb-2" style="color: var(--color-taupe);">Social Bingo</h1>
        <p class="text-lg mb-8" style="color: var(--color-taupe-muted);">Soc Ops</p>

        <div class="bg-white rounded-lg p-6 shadow-sm border border-taupe-light mb-8" style="border-top: 2px solid var(--color-rust);">
            <h2 class="font-semibold mb-3" style="color: var(--color-taupe);">Getting Started</h2>
            <ul class="text-left text-sm space-y-2" style="color: var(--color-taupe-muted);">
                <li>• Find people around you who match each square</li>
                <li>• Tap a square when you find a match</li>
                <li>• Complete 5 in a row to win</li>
            </ul>
        </div>

        <button
            hx-post="/start"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="w-full bg-accent text-white font-semibold py-4 px-8 rounded-lg text-lg transition-colors"
            style="background-color: var(--color-rust);">
            Play
        </button>
    </div>
</div>
</div>
