<div id="game-container">
<div class="flex flex-col items-center justify-center min-h-full p-6 bg-white">
    <div class="text-center max-w-sm">
        <h1 class="text-4xl font-bold uppercase mb-2">SOCIAL BINGO</h1>
        <p class="text-lg mb-8">Find your people</p>

        <div class="bg-white border-2 p-6 mb-8 text-left">
            <h2 class="font-bold uppercase mb-3">RULES</h2>
            <ul class="text-left text-sm space-y-2">
                <li>• Find people who match the questions</li>
                <li>• Tap a square when you find a match</li>
                <li>• Get 5 in a row to win!</li>
            </ul>
        </div>

        <button
            hx-post="/start"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="w-full bg-accent text-black font-bold uppercase py-4 px-8 text-lg">
            START
        </button>
    </div>
</div>
</div>
