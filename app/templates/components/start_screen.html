<div id="game-container">
<div class="flex flex-col items-center justify-center min-h-full p-6 bg-gray-50">
    <div class="text-center max-w-sm">
        <h1 class="text-4xl font-bold text-gray-900 mb-2">Find Your People</h1>
        <p class="text-lg text-gray-600 mb-8">Social Bingo</p>

        <div class="mb-8">
            <h2 class="font-semibold text-gray-800 mb-3">How it works</h2>
            <ul class="text-left text-gray-600 text-sm space-y-2">
                <li>• Find people who match each square</li>
                <li>• Mark the square when you find one</li>
                <li>• Complete a line of 5 to win</li>
            </ul>
        </div>

        <button
            hx-post="/start"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="w-full bg-accent text-white font-semibold py-4 px-8 rounded-lg text-lg">
            Begin
        </button>
    </div>
</div>
</div>
