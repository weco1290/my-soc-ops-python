<div id="game-container">
<div class="flex flex-col min-h-full bg-white">
    <!-- Header -->
    <header class="flex items-center justify-between p-3 bg-white border-b">
        <button
            hx-post="/reset"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="text-black text-sm px-3 py-1\.5 font-bold uppercase">
            ← BACK
        </button>
        <h1 class="font-bold uppercase">SOCIAL BINGO</h1>
        <div class="w-16"></div>
    </header>

    <!-- Instructions -->
    <p class="text-center text-sm py-2 px-4 font-bold">
        Find a person. Mark the square.
    </p>

    <!-- Board -->
    <div class="flex-1 flex items-center justify-center p-3">
        {% include "components/bingo_board.html" %}
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
</div>
