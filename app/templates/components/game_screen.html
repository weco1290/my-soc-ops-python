<div id="game-container">
<div class="flex flex-col min-h-full" style="background-color: var(--color-bg);">
    <!-- Header -->
    <header class="flex items-center justify-between p-3 border-b" style="background-color: var(--color-cream); border-color: var(--color-border);">
        <button
            hx-post="/reset"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="text-sm px-3 py-1.5 rounded transition-colors"
            style="color: var(--color-taupe-muted);">
            ← Back
        </button>
        <h1 class="font-bold" style="color: var(--color-taupe);">Soc Ops</h1>
        <div class="w-16"></div>
    </header>

    <!-- Instructions -->
    <p class="text-center text-sm py-2 px-4" style="color: var(--color-taupe-muted);">
        Find a person who matches each square and mark them.
    </p>

    <!-- Board -->
    <div class="flex-1 flex items-center justify-center p-3">
        {% include "components/bingo_board.html" %}
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
</div>
